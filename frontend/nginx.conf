server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Third-party images (hotel photos, map tiles) are allowed over https only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A search waits on the hotel APIs, so allow more than nginx's default.
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        # Any add_header here replaces the server-level ones, so repeat nosniff.
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
